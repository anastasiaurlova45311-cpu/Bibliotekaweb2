<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b8c6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d6cb9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <g transform="translate(20, 18)">
    <!-- Book shape -->
    <rect x="8" y="5" width="44" height="55" rx="3" fill="#fff" opacity="0.9"/>
    <rect x="5" y="5" width="6" height="55" rx="2" fill="#fff" opacity="0.7"/>
    <!-- Lines on page -->
    <line x1="16" y1="18" x2="44" y2="18" stroke="#5b8c6e" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="26" x2="40" y2="26" stroke="#5b8c6e" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="34" x2="42" y2="34" stroke="#5b8c6e" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="42" x2="36" y2="42" stroke="#5b8c6e" stroke-width="2" stroke-linecap="round"/>
    <!-- Bookmark -->
    <polygon points="38,5 48,5 48,20 43,16 38,20" fill="#f4b942"/>
  </g>
</svg>
